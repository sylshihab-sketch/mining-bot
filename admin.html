<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Mining Bot</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 15px; }
    h1, h2 { text-align: center; color: #0088cc; }
    .card { background: #1e1e1e; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background-color: #2a2a2a; color: #0088cc; }
    button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-approve { background: #28a745; color: white; }
    .btn-reject { background: #dc3545; color: white; }
    .btn-block { background: #ffc107; color: black; }
    input { padding: 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; width: 80px; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>Mining Bot Admin Panel</h1>

  <!-- Users Section -->
  <div class="card">
    <h2>User List & Balance Control</h2>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Balance</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTable">
        <tr><td colspan="4">Loading users...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Withdraw Requests Section -->
  <div class="card">
    <h2>Withdraw Requests</h2>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Amount</th>
          <th>Method</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="withdrawTable">
        <tr><td colspan="5">Loading requests...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ⚠️ আপনার Firebase Web App Config কোডটি এখানে বসান
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. Fetch and Display Users
    function loadUsers() {
      db.collection("users").onSnapshot(snapshot => {
        const userTable = document.getElementById("userTable");
        userTable.innerHTML = "";
        
        snapshot.forEach(doc => {
          const user = doc.data();
          const userId = doc.id;
          
          userTable.innerHTML += `
            <tr>
              <td>${userId}</td>
              <td>${user.name || 'N/A'}</td>
              <td>
                <input type="number" id="bal-${userId}" value="${user.balance || 0}">
                <button onclick="updateBalance('${userId}')">Save</button>
              </td>
              <td>
                <button class="btn-block" onclick="toggleBlock('${userId}', ${user.isBlocked || false})">
                  ${user.isBlocked ? 'Unblock' : 'Block'}
                </button>
              </td>
            </tr>
          `;
        });
      });
    }

    // 2. Update User Balance
    function updateBalance(userId) {
      const newBalance = parseFloat(document.getElementById(`bal-${userId}`).value);
      db.collection("users").doc(userId).update({ balance: newBalance })
        .then(() => alert("Balance updated!"))
        .catch(err => alert("Error: " + err.message));
    }

    // 3. Block/Unblock User
    function toggleBlock(userId, currentStatus) {
      db.collection("users").doc(userId).update({ isBlocked: !currentStatus })
        .then(() => alert("User status updated!"))
        .catch(err => alert("Error: " + err.message));
    }

    // 4. Fetch and Display Withdrawals
    function loadWithdrawals() {
      db.collection("withdrawals").onSnapshot(snapshot => {
        const withdrawTable = document.getElementById("withdrawTable");
        withdrawTable.innerHTML = "";

        snapshot.forEach(doc => {
          const req = doc.data();
          const reqId = doc.id;

          withdrawTable.innerHTML += `
            <tr>
              <td>${req.userId}</td>
              <td>${req.amount}</td>
              <td>${req.method || 'Bkash/Nagad'}</td>
              <td>${req.status}</td>
              <td>
                ${req.status === 'pending' ? `
                  <button class="btn-approve" onclick="updateWithdraw('${reqId}', 'approved')">Approve</button>
                  <button class="btn-reject" onclick="updateWithdraw('${reqId}', 'rejected')">Reject</button>
                ` : req.status}
              </td>
            </tr>
          `;
        });
      });
    }

    // 5. Update Withdrawal Status
    function updateWithdraw(reqId, status) {
      db.collection("withdrawals").doc(reqId).update({ status: status })
        .then(() => alert(`Withdrawal ${status}!`))
        .catch(err => alert("Error: " + err.message));
    }

    // Load initial data
    loadUsers();
    loadWithdrawals();
  </script>
</body>
</html>
