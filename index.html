<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Mining Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loading">
    <div class="loader"></div>
    <h2>Telegram Mining Bot</h2>
    <p>Loading...</p>
</div>

<div id="app" style="display:none">

<header>
<div class="logo">⛏ Telegram Mining Bot</div>
<div class="balance">
<h2 id="balance">0</h2>
<span>Coins</span>
</div>
</header>

<section class="dashboard">

<div class="card">
<h3>Mining</h3>
<p id="miningRate">200 Coins / Hour</p>
<button id="startMining">Start Mining</button>
</div>

<div class="card">
<h3>Daily Bonus</h3>
<button id="dailyBonus">Claim</button>
</div>

<div class="card">
<h3>Spin Wheel</h3>
<button id="spin">Spin</button>
</div>

<div class="card">
<h3>Watch Ads</h3>
<button id="watchAds">Watch</button>
</div>

</section>

<nav>

<button onclick="showPage('home')">🏠 Home</button>

<button onclick="showPage('tasks')">📋 Tasks</button>

<button onclick="showPage('friends')">👥 Friends</button>

<button onclick="showPage('withdraw')">💸 Withdraw</button>

<button onclick="showPage('profile')">👤 Profile</button>

</nav>

</div>

<script src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
