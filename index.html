<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Force Join Modal Screen -->
    <div id="force-join-screen" class="join-container">
        <h2>🔒 Access Locked</h2>
        <p>Join our 5 official channels below to unlock the app:</p>

        <div class="channel-list">
            <a href="https://t.me/channel_1" target="_blank" class="btn-channel">📢 Join Channel 1</a>
            <a href="https://t.me/channel_2" target="_blank" class="btn-channel">📢 Join Channel 2</a>
            <a href="https://t.me/channel_3" target="_blank" class="btn-channel">📢 Join Channel 3</a>
            <a href="https://t.me/channel_4" target="_blank" class="btn-channel">📢 Join Channel 4</a>
            <a href="https://t.me/channel_5" target="_blank" class="btn-channel">📢 Join Channel 5</a>
        </div>

        <button id="verify-btn" onclick="checkForceJoin()">✅ Verify & Continue</button>
    </div>

    <!-- Main App Screen -->
    <div id="main-app" style="display: none;">
        <h2>🎉 Welcome to the App!</h2>
        <div class="dashboard">
            <p>Your Balance: <strong id="balance">0.00</strong> USDT</p>
            <button onclick="openWithdrawModal()" class="btn-withdraw">💸 Withdraw</button>
        </div>
    </div>

    <!-- USDT Withdrawal Modal -->
    <div id="withdraw-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Withdraw USDT</h3>
            
            <label for="network">Select Network:</label>
            <select id="network">
                <option value="BEP20">USDT (BEP20 - BNB Smart Chain)</option>
                <option value="TON">USDT (TON Network)</option>
            </select>

            <label for="wallet-address">Wallet Address:</label>
            <input type="text" id="wallet-address" placeholder="Enter your USDT wallet address">

            <label for="amount">Amount (USDT):</label>
            <input type="number" id="amount" placeholder="Minimum $10">

            <button onclick="submitWithdrawal()" class="btn-submit">Submit Request</button>
            <button onclick="closeWithdrawModal()" class="btn-close">Cancel</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
