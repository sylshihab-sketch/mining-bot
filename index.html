<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining Earning</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a1e;
            --accent-yellow: #f59e0b;
            --accent-green: #22c55e;
            --text-color: #ffffff;
            --sub-text: #94a3b8;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            padding-bottom: 70px;
        }

        /* Profile Header */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        .user-details h4 { margin: 0; font-size: 16px; }
        .user-details p { margin: 2px 0 0; font-size: 12px; color: var(--sub-text); }
        .vip-badge {
            background: #b45309;
            color: #fef08a;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Balance Cards */
        .balance-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .bal-box {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #262b33;
        }
        .bal-box label { font-size: 11px; color: var(--sub-text); font-weight: bold; }
        .bal-box .value { font-size: 20px; font-weight: bold; margin-top: 5px; }
        .coins { color: var(--accent-yellow); }
        .usdt { color: var(--accent-green); }

        /* Daily Streak */
        .streak-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #262b33;
            margin-bottom: 15px;
        }
        .streak-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .day-box {
            background: #0f1216;
            border: 1px solid #22272e;
            border-radius: 6px;
            padding: 6px 2px;
            text-align: center;
            font-size: 9px;
            color: var(--sub-text);
        }
        .day-box.active {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        .day-box.today {
            background: var(--accent-yellow);
            color: #000;
            font-weight: bold;
            border: none;
        }
        .claim-btn {
            width: 100%;
            background: var(--accent-green);
            border: none;
            color: #000;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Action Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .action-btn {
            background: var(--card-bg);
            border: 1px solid #262b33;
            border-radius: 8px;
            padding: 10px 0;
            text-align: center;
            font-size: 10px;
            color: var(--text-color);
            cursor: pointer;
        }
        .action-btn div { font-size: 16px; margin-bottom: 4px; }

        /* Tap Mining */
        .mining-area {
            text-align: center;
            margin-top: 10px;
        }
        .mine-tap-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #f59e0b 0%, #78350f 100%);
            border: 4px solid #fbbf24;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .mine-tap-btn:active { transform: scale(0.95); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid #262b33;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
        }
        .nav-link {
            color: var(--sub-text);
            text-decoration: none;
            font-size: 10px;
            text-align: center;
        }
        .nav-link.active { color: var(--accent-yellow); }
    </style>
</head>
<body>

    <!-- Profile Section -->
    <div class="profile-card">
        <div class="avatar" id="avatar">U</div>
        <div class="user-details">
            <h4 id="username">User Name <span class="vip-badge">VIP 2</span></h4>
            <p id="userhandle">@user • <span style="color:#a855f7;">0/6 working</span></p>
        </div>
    </div>

    <!-- Balance Section -->
    <div class="balance-container">
        <div class="bal-box">
            <label>COINS</label>
            <div class="value coins" id="coinCount">60</div>
        </div>
        <div class="bal-box">
            <label>USDT</label>
            <div class="value usdt" id="usdtCount">0.592</div>
        </div>
    </div>

    <!-- Daily Streak Section -->
    <div class="streak-card">
        <div class="streak-header">
            <span>🔥 Daily Streak</span>
            <span style="color: var(--accent-yellow);">Day 7 of 7</span>
        </div>
        <div class="days-grid">
            <div class="day-box active">D1<br>100</div>
            <div class="day-box active">D2<br>250</div>
            <div class="day-box active">D3<br>300</div>
            <div class="day-box active">D4<br>350</div>
            <div class="day-box active">D5<br>400</div>
            <div class="day-box active">D6<br>450</div>
            <div class="day-box today">D7<br>500</div>
        </div>
        <div style="font-size: 10px; color: var(--sub-text); margin-bottom: 6px;">Today's reward · watch an ad <b style="color:var(--accent-yellow);">+500 coins</b></div>
        <button class="claim-btn" onclick="claimReward()">► Claim</button>
    </div>

    <!-- Middle Action Buttons -->
    <div class="action-grid">
        <div class="action-btn" onclick="alert('Convert Coins to USDT')"><div>💱</div>Convert</div>
        <div class="action-btn" onclick="alert('Withdraw Request')"><div>💵</div>Withdraw</div>
        <div class="action-btn" onclick="alert('Mining Stats')"><div>⛏️</div>Mine</div>
        <div class="action-btn" onclick="alert('Upgrade VIP')"><div>👑</div>VIP</div>
        <div class="action-btn" onclick="alert('History Log')"><div>📜</div>History</div>
    </div>

    <!-- Mining Tap Button -->
    <div class="mining-area">
        <button class="mine-tap-btn" onclick="tapToMine()">⛏️</button>
        <p style="font-size: 11px; color: var(--sub-text); margin-top: 8px;">ট্যাপ করে কয়েন মাইন করুন</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-link active">🏠<br>Home</a>
        <a href="#" class="nav-link" onclick="alert('Tasks Page')">📋<br>Tasks</a>
        <a href="#" class="nav-link" onclick="alert('Referral Page')">👥<br>Friends</a>
        <a href="#" class="nav-link" onclick="alert('Profile Page')">👤<br>Profile</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let coins = 60;
        let usdt = 0.592;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').childNodes[0].nodeValue = user.first_name + " ";
            document.getElementById('userhandle').innerText = "@" + (user.username || "user") + " • 0/6 working";
            document.getElementById('avatar').innerText = user.first_name[0];
        }

        function tapToMine() {
            coins += 1;
            document.getElementById('coinCount').innerText = coins;
        }

        function claimReward() {
            coins += 500;
            document.getElementById('coinCount').innerText = coins;
            alert('500 Coins added!');
        }
    </script>
</body>
</html>
