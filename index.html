<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Mining Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f18;
color:#fff;
}

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#0b0f18;
z-index:999;
}

.loader{
width:70px;
height:70px;
border:6px solid #222;
border-top:6px solid #ffb400;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:20px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#141b28;
border-bottom:1px solid #333;
}

.logo{
font-size:20px;
font-weight:bold;
color:#ffb400;
}

.balance{
text-align:right;
}

.balance h2{
color:#00ff99;
font-size:26px;
}

.dashboard{
padding:15px;
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.card{
background:#1b2435;
padding:20px;
border-radius:18px;
border:1px solid #333;
box-shadow:0 0 15px rgba(255,180,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-3px);
}

.card h3{
margin-bottom:10px;
color:#ffb400;
}

.card p{
margin-bottom:15px;
color:#bbb;
}

.card button, .card input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-weight:bold;
font-size:16px;
margin-bottom: 10px;
}

.card button{
background:linear-gradient(90deg,#ffb400,#ff8800);
cursor:pointer;
color: #000;
}

.card input{
background: #111622;
color: #fff;
border: 1px solid #333;
}

.page {
display: none;
padding-bottom: 80px;
}

.page.active {
display: block;
}

.leader{
display: flex;
justify-content: space-between;
background: #141b28;
padding: 12px;
margin-bottom: 8px;
border-radius: 8px;
align-items: center;
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:#141b28;
padding:12px 0;
border-top:1px solid #333;
z-index: 99;
}

nav button{
background:none;
border:none;
color:#aaa;
font-size:14px;
cursor:pointer;
}

nav button:hover{
color:#ffb400;
}

.toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#00b894;
padding:12px 18px;
border-radius:10px;
display:none;
font-weight:bold;
z-index:9999;
color: #fff;
}
</style>
</head>

<body>

<div class="toast" id="toastMessage"></div>

<div id="loading">
    <div class="loader"></div>
    <h2>Telegram Mining Bot</h2>
    <p>Loading...</p>
</div>

<div id="app" style="display:none">

<header>
<div class="logo">⛏ Telegram Mining Bot</div>
<div class="balance">
<h2 id="balance">0</h2>
<span id="vipBadge">VIP 1</span>
</div>
</header>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
<section class="dashboard">
<div class="card">
<h3>Mining</h3>
<p id="miningRate">200 Coins / Hour</p>
<button id="startMining">Start Mining</button>
</div>
<div class="card">
<h3>Daily Bonus</h3>
<button id="dailyBonus">Claim</button>
</div>
<div class="card">
<h3>Spin Wheel</h3>
<button id="spin">Spin</button>
</div>
</section>
</div>

<!-- TASKS PAGE -->
<div id="page-tasks" class="page">
<section class="dashboard">
<div class="card">
<h3>Tasks</h3>
<p>Complete tasks to earn extra coins.</p>
</div>
</section>
</div>

<!-- FRIENDS PAGE -->
<div id="page-friends" class="page">
<section class="dashboard">
<div class="card">
<h3>Referral System</h3>
<p>Invite friends and earn rewards!</p>
<button onclick="shareReferral()">Share Link</button>
<button onclick="copyReferral()">Copy Link</button>
</div>
</section>
</div>

<!-- WITHDRAW PAGE -->
<div id="page-withdraw" class="page">
<section class="dashboard">
<div class="card">
<h3>Withdraw</h3>
<p>Minimum 30000 Coins</p>
<input type="number" id="withdrawAmount" placeholder="Enter Coins">
<input type="text" id="wallet" placeholder="Enter Wallet / Address">
<button onclick="withdraw()">Submit Withdraw</button>
</div>
</section>
</div>

<!-- PROFILE / LEADERBOARD PAGE -->
<div id="page-profile" class="page">
<section class="dashboard">
<div class="card">
<h3>Leaderboard (Top 20)</h3>
<div id="leaderboard"></div>
</div>
</section>
</div>

<nav>
<button onclick="showPage('home')">🏠 Home</button>
<button onclick="showPage('tasks')">📋 Tasks</button>
<button onclick="showPage('friends')">👥 Friends</button>
<button onclick="showPage('withdraw')">💸 Withdraw</button>
<button onclick="showPage('profile')">👤 Profile</button>
</nav>

</div>

<script>
// =======================
// Telegram Mining Bot & Core Script
// =======================

const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user || {
    id: "demo_user",
    first_name: "Guest"
};

let balance = 0;
let mining = false;
let miningSpeed = 200; // coins/hour
let referrals = 0;
let vip = 1;

// ফায়ারবেস কনফিগারেশন (আপনার রিয়েল প্রজেক্টের ভ্যালু দিয়ে এটি পরিবর্তন করে নেবেন)
const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyForTemplate12345",
    authDomain: "telegram-mining-bot.firebaseapp.com",
    projectId: "telegram-mining-bot",
    storageBucket: "telegram-mining-bot.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef123456"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const userRef = db.collection("users").doc(user.id.toString());

loadUser();

async function loadUser(){
    try {
        const doc = await userRef.get();
        if(doc.exists){
            const data = doc.data();
            balance = data.balance || 0;
            referrals = data.referrals || 0;
            vip = data.vip || 1;
            updateBalance();
            updateVIP();
        }else{
            await userRef.set({
                name: user.first_name,
                balance: 500,
                vip: 1,
                referrals: 0,
                lifetime: 500
            });
            balance = 500;
            updateBalance();
            updateVIP();
        }
    } catch(err) {
        console.error(err);
    }
    hideLoading();
}

function updateBalance(){
    document.getElementById("balance").innerHTML = Math.floor(balance);
}

function hideLoading(){
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
}

async function saveUser(){
    try {
        await userRef.update({
            balance: balance
        });
    } catch(err) {
        console.error(err);
    }
}

document.getElementById("dailyBonus").onclick = async () => {
    balance += 500;
    updateBalance();
    await saveUser();
    toast("🎁 Daily Bonus Claimed");
};

document.getElementById("spin").onclick = async () => {
    let reward = Math.floor(Math.random() * 900) + 100;
    balance += reward;
    updateBalance();
    await saveUser();
    toast("🎡 You Won " + reward + " Coins");
};

document.getElementById("startMining").onclick = () => {
    if(mining){
        toast("Mining already running");
        return;
    }
    mining = true;
    toast("⛏ Mining Started");
    startMining();
};

function startMining(){
    setInterval(async () => {
        if(!mining) return;
        balance += (miningSpeed / 3600);
        updateBalance();
        await saveUser();
    }, 1000);
}

function toast(msg){
    let t = document.getElementById("toastMessage");
    t.innerHTML = msg;
    t.style.display = "block";
    setTimeout(() => {
        t.style.display = "none";
    }, 2500);
}

// =======================
// Navigation / Page Switcher
// =======================
function showPage(pageId){
    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });
    document.getElementById('page-' + pageId).classList.add('active');
    
    if(pageId === 'profile'){
        leaderboard();
    }
}

// =======================
// Referral System
// =======================
function updateVIP() {
    if (referrals >= 10) {
        vip = 3;
    } else if (referrals >= 5) {
        vip = 2;
    } else {
        vip = 1;
    }

    document.getElementById("vipBadge").innerHTML = "VIP " + vip;

    userRef.update({
        vip: vip
    });
}

// =======================
// Referral Link
// =======================
function shareReferral() {
    const bot = "mining_earning_the11_bot";
    const url = `https://t.me/share/url?url=https://t.me/${bot}?start=${user.id}`;
    window.open(url);
}

function copyReferral(){
    const bot = "mining_earning_the11_bot";
    navigator.clipboard.writeText(`https://t.me/${bot}?start=${user.id}`);
    toast("Referral Link Copied");
}

// =======================
// Withdraw
// =======================
async function withdraw(){
    let amount = parseInt(document.getElementById("withdrawAmount").value);
    let wallet = document.getElementById("wallet").value;

    if(isNaN(amount) || amount < 30000){
        toast("Minimum 30000 Coins");
        return;
    }

    if(!wallet){
        toast("Enter a valid wallet address");
        return;
    }

    if(amount > balance){
        toast("Insufficient Balance");
        return;
    }

    balance -= amount;
    updateBalance();
    await saveUser();

    await db.collection("withdraws").add({
        user: user.id,
        name: user.first_name,
        wallet: wallet,
        coins: amount,
        status: "Pending",
        time: new Date()
    });

    toast("Withdraw Submitted");
}

// =======================
// Leaderboard
// =======================
async function leaderboard(){
    try {
        const snap = await db.collection("users")
            .orderBy("balance", "desc")
            .limit(20)
            .get();

        let html = "";
        let rank = 1;
        snap.forEach(doc => {
            let d = doc.data();
            html += `
                <div class="leader">
                    <span>#${rank}</span>
                    <span>${d.name || 'User'}</span>
                    <b>${Math.floor(d.balance || 0)}</b>
                </div>
            `;
            rank++;
        });
        document.getElementById("leaderboard").innerHTML = html;
    } catch(err) {
        console.error(err);
    }
}
</script>

</body>
</html>
