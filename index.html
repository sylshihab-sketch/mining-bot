<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

<body>

<div id="loading-screen">

<div id="app" style="display:none;">

<div class="balance">

</div>

</div>

<script src="script.js"></script>
