<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Earning</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<header class="topbar">

<div class="logo">
⛏
</div>

<div class="title">
<h2>Mining Earning</h2>
<p>Thee Man</p>
</div>

<div class="icons">
<button>🔔</button>
<button>⚙️</button>
</div>

</header>

<section class="profile-card">

<div class="avatar"></div>

<div class="info">

<h2 id="name">Loading...</h2>

<p id="username">@username</p>

<span class="vip">VIP 2</span>

</div>

</section>

<section class="balance">

<div class="box">

<p>Coins</p>

<h1 id="coins">0</h1>

</div>

<div class="box">

<p>USDT</p>

<h1 id="usdt">0.000</h1>

</div>

</section>

<section class="daily">

<h3>🔥 Daily Streak</h3>

<div class="days">

<div>D1<br>100</div>

<div>D2<br>250</div>

<div>D3<br>300</div>

<div>D4<br>350</div>

<div>D5<br>400</div>

<div>D6<br>450</div>

<div class="active">D7<br>500</div>

</div>

<button id="claimBtn">Claim +500</button>

</section>

<section class="promo">

<h3>🎁 Promo Code</h3>

<input placeholder="ENTER CODE">

<button>Redeem</button>

</section>

<section class="actions">

<button>Convert</button>

<button>Withdraw</button>

<button id="mineBtn">Mine</button>

<button>VIP</button>

<button>History</button>

</section>

<section class="stats">

<div class="card">

<h4>Total Earned</h4>

<h2 id="earned">0</h2>

</div>

<div class="card">

<h4>Referrals</h4>

<h2>0</h2>

</div>

<div class="card">

<h4>Working</h4>

<h2>0/6</h2>

</div>

<div class="card">

<h4>Pending</h4>

<h2>0</h2>

</div>

</section>

<nav class="bottom">

<button class="active">🏠<br>Home</button>

<button>📋<br>Tasks</button>

<button class="mine">⛏</button>

<button>👥<br>Friends</button>

<button>👤<br>Profile</button>

</nav>

<script src="script.js"></script>

</body>
