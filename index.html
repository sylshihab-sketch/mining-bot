<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mining Buddies App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .title { color: #f39c12; font-size: 20px; font-weight: bold; }
    .balance-card { background: #1e1e1e; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; }
    .balance-val { font-size: 32px; font-weight: bold; color: #f39c12; }
    .sub-text { color: #aaa; font-size: 12px; }
    .section-title { font-size: 14px; margin: 20px 0 10px; color: #ccc; }
    .rig-card { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a2a; }
    .rig-info h4 { margin: 0; font-size: 16px; color: #fff; }
    .rig-info p { margin: 3px 0 0; font-size: 12px; color: #f39c12; }
    .btn-start { background: #f39c12; color: #000; border: none; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-start:disabled { background: #444; color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">⛏ Mining Buddies</div>
  </div>

  <div class="balance-card">
    <div class="sub-text">TOTAL BALANCE</div>
    <div class="balance-val" id="userBalance">0</div>
    <div class="sub-text" id="conversionText">≈ $0.000 <span class="coin-name">USDT</span></div>
  </div>

  <div class="section-title">Mining Rigs (Requires Ads)</div>

  <!-- Miner 1 -->
  <div class="rig-card">
    <div class="rig-info">
      <h4>Miner 1</h4>
      <p>+<span id="rateDisplay">1000</span> <span class="coin-name">Coins</span>/Session</p>
    </div>
    <button class="btn-start" onclick="startMining()">Start Mining</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAdwa_dIAsI-qXcFiFpzhBq-990DWCHGVI",
      authDomain: "mining-bot-8e30c.firebaseapp.com",
      projectId: "mining-bot-8e30c",
      storageBucket: "mining-bot-8e30c.firebasestorage.app",
      messagingSenderId: "694631075545",
      appId: "1:694631075545:web:a9b3de75a9ee3f82bf78c8",
      measurementId: "G-8047B0V003"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const tg = window.Telegram?.WebApp;
    tg?.expand();

    const user = tg?.initDataUnsafe?.user || { id: "test_user", first_name: "User" };
    const userId = user.id.toString();

    let currentMiningRate = 1000;

    // 1. Load Admin Settings Real-time
    db.collection("settings").doc("global").onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        const coin = data.coinType || "USDT";
        currentMiningRate = data.miningRate || 1000;

        // Update UI Coin Name & Mining Rate
        document.querySelectorAll(".coin-name").forEach(el => el.innerText = coin);
        document.getElementById("rateDisplay").innerText = currentMiningRate;
      }
    });

    // 2. Load User Balance Real-time
    const userRef = db.collection("users").doc(userId);
    userRef.onSnapshot(doc => {
      if (doc.exists) {
        document.getElementById("userBalance").innerText = doc.data().balance || 0;
      } else {
        userRef.set({ name: user.first_name, balance: 0, isBlocked: false });
      }
    });

    // 3. Mining Action
    function startMining() {
      userRef.get().then(doc => {
        if (doc.exists && doc.data().isBlocked) {
          alert("Your account is blocked!");
          return;
        }
        const newBal = (doc.data()?.balance || 0) + currentMiningRate;
        userRef.update({ balance: newBal }).then(() => {
          alert("Mining successful!");
        });
      });
    }
  </script>
</body>
</html>
